<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5ede0">
<meta name="robots" content="noindex, nofollow">
<title>Biz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Spectral:ital,wght@0,300;0,400;1,300&family=Amiri&display=swap" rel="stylesheet">
<style>
:root{
  --display:"Newsreader",Iowan Old Style,Palatino,Georgia,"Times New Roman",serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --arabic:"Amiri","Scheherazade New","Geeza Pro","Times New Roman",serif;

  --paper:#f5ede0;
  --paper-2:#ece0cd;
  --ink:#241c17;
  --ink-2:#4a3d33;
  --muted:#7a6b58;
  --faint:#a4937a;
  --gold:#b08838;
  --madder:#9e3b2e;
  --rule:rgba(120,100,74,.26);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  /* the grain of paper, not a flat screen */
  background-image:
    radial-gradient(110% 60% at 15% 0%, rgba(176,136,56,.07), transparent 60%),
    radial-gradient(90% 50% at 90% 100%, rgba(158,59,46,.05), transparent 60%);
  background-attachment:fixed;
}

/* ---------------- opening ---------------- */
.opening{
  min-height:100svh;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:56px 26px 40px;text-align:center;gap:0;
}
.opening .ar{
  font-family:var(--arabic);font-size:25px;line-height:2.15;direction:rtl;
  color:var(--ink);margin:0 0 30px;max-width:20ch;
}
.opening .meaning{
  font-family:var(--display);font-style:italic;font-weight:300;
  font-size:19px;line-height:1.62;color:var(--ink-2);
  margin:0 0 22px;max-width:30ch;text-wrap:balance;
}
.opening .ref{
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);margin:0;font-family:var(--body);
}
.opening .note{
  font-size:10.5px;color:var(--faint);margin:34px 0 0;font-style:italic;
}
.opening .down{
  margin-top:46px;width:1px;height:56px;
  background:linear-gradient(var(--gold),transparent);
}

/* ---------------- masthead ---------------- */
.mast{padding:20px 26px 6px;text-align:center}
.mast h1{
  font-family:var(--display);font-weight:300;font-size:38px;line-height:1;
  margin:0;letter-spacing:-.005em;
}
.mast p{
  font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);margin:14px 0 0;
}
.mast .count{
  font-family:var(--display);font-style:italic;font-size:16px;
  color:var(--gold);margin:10px 0 0;
  letter-spacing:0;text-transform:none;   /* .mast p sets both — undo them here */
}

/* ---------------- the thread ---------------- */
.story{
  max-width:620px;margin:0 auto;padding:44px 26px 0;position:relative;
}
.entry{
  position:relative;padding:0 0 54px 30px;
}
/* the gold thread runs down the left of every entry */
.entry::before{
  content:"";position:absolute;left:5px;top:8px;bottom:-8px;width:1px;
  background:var(--gold);opacity:.42;
}
.entry:last-child::before{
  background:linear-gradient(var(--gold),transparent);opacity:.42;
}
.entry .knot{
  position:absolute;left:0;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 4px var(--paper);
}
.entry.future::before{
  background:none;
  border-left:1px dashed var(--gold);opacity:.42;left:5px;width:0;
}
.entry.future .knot{background:var(--paper);border:1px solid var(--gold)}

.entry .date{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);margin:0 0 3px;font-variant-numeric:tabular-nums;
}
.entry .when{
  font-size:11px;letter-spacing:.06em;color:var(--faint);
  margin:0 0 12px;font-style:italic;text-transform:none;letter-spacing:0;
}
.entry h2{
  font-family:var(--display);font-weight:400;font-size:25px;line-height:1.22;
  margin:0 0 14px;text-wrap:balance;
}
.entry p.t{
  font-size:17.5px;line-height:1.68;color:var(--ink-2);margin:0 0 13px;
  max-width:60ch;
}
.entry p.t:last-of-type{margin-bottom:0}

.entry blockquote{
  margin:18px 0 0;padding:14px 0 14px 16px;
  border-left:2px solid var(--madder);
}
.entry blockquote p{
  font-family:var(--display);font-style:italic;font-size:18px;line-height:1.58;
  margin:0;color:var(--ink);
}
.entry blockquote .by{
  font-family:var(--body);font-style:normal;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--madder);margin:9px 0 0;display:block;
}

/* photographs, as prints laid on the page */
.shots{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 0}
.shots figure{margin:0;flex:1 1 160px}
.shots img{
  display:block;width:100%;height:auto;border-radius:2px;
  background:var(--paper-2);
  border:1px solid var(--rule);
  padding:6px;
}
.shots figcaption{
  font-size:11px;color:var(--faint);margin:7px 0 0;font-style:italic;
}

/* ---------------- the end that isn't one ---------------- */
.tail{
  max-width:620px;margin:0 auto;padding:0 26px 90px 56px;position:relative;
}
.tail .line{
  position:absolute;left:31px;top:-8px;height:80px;
  border-left:1px dashed var(--gold);opacity:.34;
}
.tail p{
  font-family:var(--display);font-style:italic;font-size:16px;
  color:var(--muted);margin:86px 0 0;
}

.reveal{opacity:0;transform:translateY(12px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
}
@media (min-width:620px){
  .opening .ar{font-size:29px}
  .opening .meaning{font-size:21px}
  .mast h1{font-size:52px}
  .entry h2{font-size:28px}
  .story{padding-left:34px;padding-right:34px}
}
</style>
</head>
<body>

<header class="opening">
  <p class="ar" id="ar"></p>
  <p class="meaning" id="meaning"></p>
  <p class="ref" id="ref"></p>
  <p class="note" id="note"></p>
  <div class="down" aria-hidden="true"></div>
</header>

<div class="mast">
  <h1 id="siteTitle"></h1>
  <p id="siteSub"></p>
  <p class="count" id="siteCount"></p>
</div>

<main class="story" id="story"></main>

<div class="tail">
  <div class="line" aria-hidden="true"></div>
  <p id="tail">Davomi bor.</p>
</div>

<script src="story.js"></script>
<script>
/* ================= sahifani chizish ================= */

const $ = function(id){ return document.getElementById(id); };
const DAY = 86400000;

function parseDate(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

const MONTHS = ['yanvar','fevral','mart','aprel','may','iyun',
                'iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
function longDate(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }

const TODAY = midnight(new Date());
const START = parseDate(SITE.startDate);

/* ---- ochilish ---- */
$('ar').textContent      = SITE.opening.arabic;
$('meaning').textContent = SITE.opening.meaning;
$('ref').textContent     = SITE.opening.ref;
$('note').textContent    = SITE.opening.note;
$('siteTitle').textContent = SITE.title;
$('siteSub').textContent   = SITE.subtitle;

(function(){
  const days = Math.floor((TODAY - START) / DAY) + 1;
  $('siteCount').textContent = days > 0
    ? days + '-kun'
    : longDate(START) + ' dan boshlanadi';
})();

/* ---- kelasi sana uchun izoh ---- */
function whenLabel(d){
  const diff = Math.round((d - TODAY) / DAY);
  if (diff === 0) return 'bugun';
  if (diff === 1) return 'ertaga';
  if (diff > 1)   return diff + ' kundan keyin';
  return null;                       // o'tgan kun — izoh kerak emas
}

/* ---- hikoyani sanaga qarab tartiblash ---- */
const entries = STORY.slice().sort(function(a, b){
  return parseDate(a.date) - parseDate(b.date);
});

const main = $('story');

entries.forEach(function(item){
  const d = parseDate(item.date);
  const future = d > TODAY;

  const sec = document.createElement('section');
  sec.className = 'entry reveal' + (future ? ' future' : '');

  const knot = document.createElement('div');
  knot.className = 'knot';
  sec.appendChild(knot);

  const date = document.createElement('p');
  date.className = 'date';
  date.textContent = longDate(d);
  sec.appendChild(date);

  const w = whenLabel(d);
  if (w){
    const when = document.createElement('p');
    when.className = 'when';
    when.textContent = w;
    sec.appendChild(when);
  }

  if (item.title){
    const h = document.createElement('h2');
    h.textContent = item.title;
    sec.appendChild(h);
  }

  (item.text || []).forEach(function(t){
    const p = document.createElement('p');
    p.className = 't';
    p.textContent = t;
    sec.appendChild(p);
  });

  if (item.quote){
    const bq = document.createElement('blockquote');
    const p = document.createElement('p');
    p.textContent = item.quote;
    bq.appendChild(p);
    if (item.by){
      const by = document.createElement('span');
      by.className = 'by';
      by.textContent = item.by;
      bq.appendChild(by);
    }
    sec.appendChild(bq);
  }

  if (item.photos && item.photos.length){
    const wrap = document.createElement('div');
    wrap.className = 'shots';
    item.photos.forEach(function(src){
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.src = src.indexOf('/') > -1 ? src : 'photos/' + src;
      img.alt = item.title || longDate(d);
      img.loading = 'lazy';
      fig.appendChild(img);
      wrap.appendChild(fig);
    });
    sec.appendChild(wrap);
  }

  main.appendChild(sec);
});

/* ---- xotiralar birin-ketin paydo bo'ladi ---- */
(function(){
  const items = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window) ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    items.forEach(function(el){ el.classList.add('in'); });
    return;
  }
  const io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold:.12, rootMargin:'0px 0px -6% 0px' });
  items.forEach(function(el){ io.observe(el); });
})();
</script>
</body>
</html>
